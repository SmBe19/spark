<div class="room-admin-wrapper">
  <div class="poll-edit">
    <div class="poll-edit-button">
      <button (click)="showRoomEditForm.set(!showRoomEditForm())">
        {{ showRoomEditForm() ? 'Hide' : 'Edit Room' }}
      </button>
    </div>
    <div class="pollEditForm" [ngClass]="{ 'hide-form': !showRoomEditForm() }">
      <div>
        <form (submit)="$event.preventDefault(); updateRoom()">
          <div class="form-input">
            <label
              >Slug:
              <input type="text" placeholder="Slug" [formField]="roomInfoForm.slug" />
            </label>
          </div>
          <div class="form-input">
            <label
              >Name:
              <input type="text" placeholder="Name" [formField]="roomInfoForm.name" />
            </label>
          </div>
          <div class="form-input">
            <button type="submit" [disabled]="!dirtyValues().slug && !dirtyValues().name">
              Update Room
            </button>
          </div>
        </form>
      </div>
      <div>
        @if (deletingRoom()) {
          <p>Are you sure you want to delete this room?</p>
          <button (click)="confirmDeleteRoom()">Yes, Delete</button>
          <button (click)="cancelDeleteRoom()">Cancel</button>
        } @else {
          <button (click)="startDeleteRoom()">Delete Room</button>
        }
      </div>
    </div>
    <div>
      <form (submit)="updateActiveQuestionIndex()">
        <div>
          <input
            type="number"
            placeholder="Active Question Index"
            [formField]="roomInfoForm.activeQuestionIndex"
          />
          <button type="submit" [disabled]="!dirtyValues().activeQuestionIndex">Update</button>
        </div>
        <div>
          <button
            (click)="previousQuestion()"
            type="button"
            [disabled]="roomInfoModel().activeQuestionIndex === 0"
          >
            &lt;
          </button>
          <button
            (click)="nextQuestion()"
            type="button"
            [disabled]="
              roomInfoModel().activeQuestionIndex === activePollParsed().questions.length - 1
            "
          >
            &gt;
          </button>
        </div>
      </form>
    </div>
    <div>
      <form (submit)="updatePoll()">
        <textarea placeholder="Poll" [formField]="roomInfoForm.activePoll"></textarea>
        <div class="form-input">
          <button type="submit" [disabled]="!dirtyValues().activePoll">Update</button>
        </div>
      </form>
    </div>
  </div>
  <div class="poll-preview">Poll preview</div>
</div>
