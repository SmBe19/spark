<div class="room-admin-wrapper">
  <div class="poll-edit">
    <div class="room-edit-buttons">
      @if (activeRoomMode() === 'poll') {
        <button (click)="archivePoll()">Archive Poll</button>
      }
      <button (click)="togglePresentationMode()">
        {{ activeRoomMode() === 'presentation' ? 'Presentation Mode' : 'Poll Mode' }}
      </button>
      <button (click)="showRoomEditForm.set(!showRoomEditForm())">
        {{ showRoomEditForm() ? 'Hide' : 'Edit Room' }}
      </button>
    </div>
    <div class="room-edit-form" [ngClass]="{ 'hide-form': !showRoomEditForm() }">
      <div>
        <form (submit)="$event.preventDefault(); updateRoom()">
          <div class="form-input">
            <label
              >Slug:
              <input type="text" placeholder="Slug" [formField]="roomInfoForm.slug" />
            </label>
          </div>
          <div class="form-input">
            <label
              >Name:
              <input type="text" placeholder="Name" [formField]="roomInfoForm.name" />
            </label>
          </div>
          <div class="form-input">
            <button type="submit" [disabled]="!dirtyValues().slug && !dirtyValues().name">
              Update Room
            </button>
          </div>
        </form>
      </div>
      <div>
        @if (deletingRoom()) {
          <div>Are you sure you want to delete this room?</div>
          <div class="room-delete-buttons">
            <button (click)="cancelDeleteRoom()">Cancel</button>
            <button class="danger-button" (click)="confirmDeleteRoom()">Yes, Delete</button>
          </div>
        } @else {
          <button class="danger-button" (click)="startDeleteRoom()">Delete Room</button>
        }
      </div>
    </div>
    @if (activeRoomMode() === 'poll') {
      <div class="question-index-form">
        <form (submit)="updateActiveQuestionIndex()">
          <div class="question-index-input">
            <input
              type="number"
              placeholder="Active Question Index"
              [formField]="roomInfoForm.activeQuestionIndex"
            />
            <button
              type="submit"
              [disabled]="dirtyValues().activePoll || !dirtyValues().activeQuestionIndex"
            >
              Update
            </button>
          </div>
        </form>
        <div class="question-index-buttons">
          <button
            (click)="previousQuestion()"
            type="button"
            [disabled]="dirtyValues().activePoll || roomInfoModel().activeQuestionIndex === 0"
          >
            &lt;
          </button>
          <button
            (click)="nextQuestion()"
            type="button"
            [disabled]="
              dirtyValues().activePoll ||
              roomInfoModel().activeQuestionIndex === activePollParsed().questions.length - 1
            "
          >
            &gt;
          </button>
        </div>
      </div>
      <div class="content-form">
        <form (submit)="updatePoll()">
          <div>
            <textarea
              placeholder="Poll"
              [formField]="roomInfoForm.activePoll"
              (keyup.control.enter)="$event.preventDefault(); updatePoll()"
            ></textarea>
          </div>
          <div>
            <button type="submit" [disabled]="!dirtyValues().activePoll">Update</button>
          </div>
        </form>
      </div>
    } @else if (activeRoomMode() === 'presentation') {
      <div class="content-form">
        <form (submit)="updatePresentation()">
          <div>
            <textarea
              placeholder="Presentation"
              [formField]="roomInfoForm.activePresentation"
              (keyup.control.enter)="$event.preventDefault(); updatePresentation()"
            ></textarea>
          </div>
          <div>
            <button type="submit" [disabled]="!dirtyValues().activePresentation">Update</button>
          </div>
        </form>
      </div>
    }
  </div>
  <div class="content-preview">
    @if (activeRoomMode() === 'poll') {
      <app-poll-preview
        [parsedPoll]="activePollParsed()"
        [activeQuestionIndex]="roomInfoModel().activeQuestionIndex"
      />
    } @else if (activeRoomMode() === 'presentation') {
      <app-presentation-preview [presentationContent]="activePresentationDebounced.value()" />
    }
  </div>
</div>
