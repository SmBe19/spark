<div class="room-nav-form-button">
  <button (click)="showRoomEditForm.set(!showRoomEditForm())">
    {{ showRoomEditForm() ? 'Hide' : 'Edit Room' }}
  </button>
</div>
<div class="room-nav-form" [ngClass]="{ 'room-nav-form-hide': !showRoomEditForm() }">
  <form (submit)="updateRoom()">
    <div class="room-nav-form-input">
      <label
        >Slug:
        <input type="text" placeholder="Slug" [formField]="roomInfoForm.slug" />
      </label>
    </div>
    <div class="room-nav-form-input">
      <label
        >Name:
        <input type="text" placeholder="Name" [formField]="roomInfoForm.name" />
      </label>
    </div>
    <div class="room-nav-form-input">
      <button type="submit" [disabled]="!dirtyValues().slug && !dirtyValues().name">
        Update Room
      </button>
    </div>
    @if (!deletingRoom()) {
      <div class="room-nav-form-input">
        <button type="button" class="danger-button" (click)="deletingRoom.set(true)">
          Delete Room
        </button>
      </div>
    } @else {
      <div>Are you sure you want to delete this room?</div>
      <div class="room-nav-form-input">
        <button type="button" class="danger-button" (click)="confirmDeleteRoom()">
          Yes, Delete
        </button>
      </div>
      <div class="room-nav-form-input">
        <button type="button" (click)="deletingRoom.set(false)">Cancel</button>
      </div>
    }
  </form>
</div>
