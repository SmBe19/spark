<div class="presentation-wrapper">
  @let presentation = activeSlide();
  @if (!presentation) {
    <div class="no-active-presentation">
      <div>{{ roomName() }}</div>
    </div>
  } @else {
    <app-spark-markdown clipboard [data]="presentation"></app-spark-markdown>
  }
</div>

<app-room-small-timer></app-room-small-timer>
