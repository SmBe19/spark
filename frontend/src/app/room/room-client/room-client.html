@if (roomInfoService.activeRoomMode() === 'presentation') {
  <app-room-client-presentation
    [roomName]="roomInfoService.activeRoom()?.name"
    [activeSlide]="roomInfoService.activePresentationSlide()"
  ></app-room-client-presentation>
} @else if (roomInfoService.activeRoomMode() === 'poll') {
  <app-room-client-poll></app-room-client-poll>
} @else if (roomInfoService.activeRoomMode() === 'timer') {
  <app-room-fullscreen-timer></app-room-fullscreen-timer>
} @else {
  <div class="blank-mode">
    <div>{{ roomInfoService.activeRoom()?.name }}</div>
  </div>
}
