@if (roomClientService.activeRoomMode() === 'presentation') {
  <app-room-client-presentation
    [roomName]="roomClientService.activeRoom()?.name"
    [activePresentation]="roomClientService.activeRoom()?.activePresentation"
  ></app-room-client-presentation>
} @else if (roomClientService.activeRoomMode() === 'poll') {
  <app-room-client-poll></app-room-client-poll>
}
