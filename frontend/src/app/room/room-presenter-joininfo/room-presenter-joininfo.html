<div
  class="join-information"
  [ngClass]="{
    'join-information-big': joinInformationMode() === 'big',
    'join-information-none': joinInformationMode() === 'none',
    'join-information-small': joinInformationMode() === 'small',
  }"
>
  @if (joinInformationMode() === 'big') {
    <div class="join-qr">
      <qrcode
        [qrdata]="'https://' + joinLink()"
        [width]="512"
        [errorCorrectionLevel]="'M'"
      ></qrcode>
    </div>
  }
  <div class="join-link" (click)="joinInformationBigRequested.set(!joinInformationBigRequested())">
    {{ joinLink() }}
  </div>
</div>
