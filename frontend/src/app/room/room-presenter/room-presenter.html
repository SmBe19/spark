<div
  class="presenter-wrapper"
  [ngStyle]="{
    'font-size.px': activeFontSize(),
    'max-width.px': activeWidth(),
  }"
>
  @if (roomService.activeRoomMode() === 'presentation') {
    @let activePresentation = roomService.activeRoom()?.activePresentation;
    @if (activePresentation) {
      <app-room-presenter-presentation
        [activePresentation]="activePresentation"
      ></app-room-presenter-presentation>
    }
  } @else if (roomService.activeRoomMode() === 'poll') {
    <app-room-presenter-poll></app-room-presenter-poll>
  }
</div>

<app-room-presenter-joininfo></app-room-presenter-joininfo>

<app-room-presenter-sizer
  [(activeFontSize)]="activeFontSize"
  [(activeWidth)]="activeWidth"
></app-room-presenter-sizer>
