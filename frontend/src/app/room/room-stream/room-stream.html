<div class="stream-wrapper" [ngClass]="{ 'light-background': lightBackground() !== false }">
  @if (currentDirectStream()) {
    <video [srcObject]="currentDirectStream()" autoplay muted playsinline></video>
  } @else if (currentWebrtcStream()) {
    <video [srcObject]="currentWebrtcStream()" autoplay muted playsinline></video>
  } @else if (currentFrameStream()) {
    <img [src]="currentFrameStream()!.currentBigFrame" alt="Stream Frame" />
  }
</div>
