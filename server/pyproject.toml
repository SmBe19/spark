[project]
name = "spark"
version = "0.1.0"
description = "Server for Spark"
readme = "README.md"
authors = [
    { name = "Benjamin Schmid" }
]
requires-python = ">=3.9"
dependencies = [
    "argon2-cffi>=25.1.0",
    "flask>=3.1.3",
    "flask-socketio>=5.7.0",
    "gevent>=26.7.0",
    "gunicorn>=23.0.0",
    "packaging>=26.3",
    "pymongo>=4.18.3",
    "python-dotenv>=1.2.1",
]

[project.scripts]
debug_server = "spark.server:debug_server"
prod_server = "spark.server:prod_server"
add_user = "spark.spark_cli:cli_add_user"
list_users = "spark.spark_cli:cli_list_users"
ping_mongo = "spark.mongo_utils:ping_mongo"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]
